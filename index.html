<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monochromatic Scene Visualizer</title>
  <link rel="stylesheet" href="./css/app.css">
  <script src="./js/app.js" defer></script>
  
</head>
<body>

  <h2>Monochromatic Color Scene Visualizer</h2>
  <label for="colorPicker">Pick Base Color:</label>
  <input type="color" id="colorPicker" value="#3498db" />

  <div class="container">
    <svg id="scene" viewBox="0 0 800 400">
      <rect id="sky" x="0" y="0" width="800" height="400" />
      <path id="mountains" d="M0,250 Q200,100 400,250 T800,250 L800,400 L0,400 Z"/>
      <path id="hills" d="M0,300 Q200,200 400,300 T800,300 L800,400 L0,400 Z"/>
      <path id="foreground" d="M0,350 Q200,300 400,350 T800,350 L800,400 L0,400 Z"/>
    </svg>

    <div class="palette" id="palette">
      <div class="swatch">
        <div class="color-box" id="skyBox"></div>
        <span id="skyLabel">Sky</span>
      </div>
      <div class="swatch">
        <div class="color-box" id="mountainsBox"></div>
        <span id="mountainsLabel">Mountains</span>
      </div>
      <div class="swatch">
        <div class="color-box" id="hillsBox"></div>
        <span id="hillsLabel">Hills</span>
      </div>
      <div class="swatch">
        <div class="color-box" id="foregroundBox"></div>
        <span id="foregroundLabel">Foreground</span>
      </div>
    </div>
  </div>

</body>
</html>
